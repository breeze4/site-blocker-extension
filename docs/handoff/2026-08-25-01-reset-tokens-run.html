  :root[data-theme="light"] {
    --bg: #f2f3f6; --card: #fbfbfc; --ink: #22262e; --muted: #656c7a;

  body {

    line-height: 1.55; max-width: 46rem; margin: 0 auto; padding: 1.25rem 1rem 4rem;
  }
  h1 { font-size: 1.45rem; margin: 0.2rem 0 0.75rem; text-wrap: balance; }
  h2, h3 { text-wrap: balance; }
  .eyebrow, .chip, .pill, th, .stepnum, .gate > h3 {
    font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.07em;
    font-weight: 600;
  }
  .eyebrow { font-size: 0.7rem; color: var(--muted); margin: 0; }
  code, pre, .times, .logtime, .cmd { font-family: var(--mono); }
  .times, .logtime { font-variant-numeric: tabular-nums; color: var(--muted); }

  .statusline { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .pill, .chip {
    font-size: 0.72rem; padding: 0.15rem 0.6rem; border-radius: 999px;
    background: var(--accent-bg); color: var(--accent);
  }
  [data-status="pass"] > .pill, .chip[data-status="pass"], td[data-status="pass"]
    { background: var(--pass-bg); color: var(--pass); }
  [data-status="fail"] > .pill, .chip[data-status="fail"], td[data-status="fail"]
    { background: var(--fail-bg); color: var(--fail); }
  .chip[data-status="queued"], .chip[data-status="skipped"]
    { background: var(--codebg); color: var(--muted); }
  .chip::after, td[data-status]::after { content: attr(data-status); }
  td[data-status] { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.07em; font-weight: 600; text-align: center; }

  .stepstrip { display: flex; gap: 4px; margin: 0.9rem 0 0.6rem; }
  .stepstrip .seg { flex: 1; height: 7px; border-radius: 2px; background: var(--line); }
  .seg[data-status="running"] { background: var(--accent); }
  .seg[data-status="pass"] { background: var(--pass); }
  .seg[data-status="fail"] { background: var(--fail); }

  .meta { display: grid; grid-template-columns: max-content 1fr; gap: 0.1rem 1rem;
    margin: 0.75rem 0 0; font-size: 0.85rem; }
  .meta dt { color: var(--muted); }
  .meta dd { margin: 0; }

  .step { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 1rem 1.1rem; margin-top: 1.1rem; }
  .step[data-status="queued"] { opacity: 0.65; }
  .step-head { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
  .step-head h2 { font-size: 1rem; margin: 0; flex: 1 1 12rem; }
  .stepnum { font-size: 0.72rem; color: var(--muted); margin-right: 0.4rem; }
  .summary { margin: 0.6rem 0 0; font-size: 0.92rem; }

  .gate { border-top: 1px solid var(--line); margin-top: 0.9rem; padding-top: 0.7rem; }
  .gate > h3 { font-size: 0.72rem; color: var(--muted); margin: 0 0 0.45rem; }
  .gate > h3 .verdict::after { content: attr(data-status); }
  .verdict[data-status="pass"] { color: var(--pass); }
  .verdict[data-status="fail"] { color: var(--fail); }

  pre { background: var(--codebg); border-radius: 6px; padding: 0.6rem 0.75rem;
    font-size: 0.78rem; line-height: 1.45; overflow-x: auto; margin: 0.4rem 0; }
  .cmd { font-size: 0.8rem; color: var(--muted); margin: 0; }
  details > summary { cursor: pointer; font-size: 0.8rem; color: var(--accent); }
  details > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; margin: 0.4rem 0; }
  .tablewrap { overflow-x: auto; }
  th { font-size: 0.68rem; color: var(--muted); text-align: left; font-weight: 600; }
  th, td { padding: 0.35rem 0.6rem 0.35rem 0; border-bottom: 1px solid var(--line);
    vertical-align: top; }

  figure { margin: 0.6rem 0; }
  figure img { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; }
  figcaption { font-size: 0.8rem; color: var(--muted); margin-top: 0.3rem; }

  .log td { font-size: 0.82rem; }
  .logtime { white-space: nowrap; padding-right: 1rem; }
  .parse-error { color: var(--fail); font-family: var(--mono); white-space: pre-wrap; }
</style>

<script>
(function () {
  var app = document.getElementById('app');
  var data;
  try {
    data = JSON.parse(document.getElementById('run').textContent);
  } catch (err) {
    var msg = document.createElement('p');
    msg.className = 'parse-error';
    msg.textContent = 'progress.json parse error: ' + err.message;
    app.appendChild(msg);
    return;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  var steps = data.steps || [];
  var events = data.events || [];
  document.title = 'Run: ' + (data.spec || 'progress');

  // ── Header ──────────────────────────────────────────────────
  var header = el('header');
  header.dataset.status = data.status || 'running';
  header.appendChild(el('p', 'eyebrow', 'Autonomous run' + (data.repo ? ' · ' + data.repo : '')));
  header.appendChild(el('h1', null, data.spec || ''));

  var done = steps.filter(function (s) { return s.status === 'pass'; }).length;
  var sl = el('div', 'statusline');
  sl.appendChild(el('span', 'pill', String(data.status || 'running').toUpperCase()));
  sl.appendChild(el('span', 'times', done + '/' + steps.length + ' steps done'));
  header.appendChild(sl);

  var strip = el('div', 'stepstrip');
  steps.forEach(function (s) {
    var seg = el('span', 'seg');
    seg.dataset.status = s.status || 'queued';
    seg.title = s.plan || s.title || '';
    strip.appendChild(seg);
  });
  header.appendChild(strip);

  var meta = el('dl', 'meta');
  function addMeta(label, node) {
    if (!node) return;
    meta.appendChild(el('dt', null, label));
    meta.appendChild(node);
  }
  if (data.started) addMeta('Started', el('dd', 'times', data.started));
  if (data.updated) addMeta('Last update', el('dd', 'times', data.updated));
  if (data.now) addMeta('Now', el('dd', null, data.now));
  if (data.branch) {
    var dd = el('dd');
    dd.appendChild(el('code', null, data.branch));
    addMeta('Branch', dd);
  }
  header.appendChild(meta);
  app.appendChild(header);

  // ── Gates ───────────────────────────────────────────────────
  function renderGate(g) {
    var d = el('div', 'gate');
    var h = el('h3', null, (g.name || g.type || 'gate') + ' · ');
    var v = el('span', 'verdict');
    v.dataset.status = g.status || 'running';
    h.appendChild(v);
    d.appendChild(h);

    if (g.cmd) d.appendChild(el('p', 'cmd', '$ ' + g.cmd));
    if (g.tail) d.appendChild(el('pre', null, g.tail));
    if (g.full) {
      var det = el('details');
      det.appendChild(el('summary', null, 'Full output'));
      det.appendChild(el('pre', null, g.full));
      if (g.status === 'fail') det.open = true;
      d.appendChild(det);
    }

    if (g.criteria && g.criteria.length) {
      var wrap = el('div', 'tablewrap');
      var t = el('table');
      var hr = el('tr');
      ['Criterion', 'Verdict', 'How it was exercised'].forEach(function (x) {
        hr.appendChild(el('th', null, x));
      });
      t.appendChild(hr);
      g.criteria.forEach(function (c) {
        var tr = el('tr');
        tr.appendChild(el('td', null, c.text || ''));
        var td = el('td');
        td.dataset.status = c.status || 'fail';
        tr.appendChild(td);
        tr.appendChild(el('td', null, c.evidence || ''));
        t.appendChild(tr);
      });
      wrap.appendChild(t);
      d.appendChild(wrap);
    }

    (g.shots || []).forEach(function (sh) {
      var f = el('figure');
      var img = el('img');
      img.src = sh.src || '';
      img.alt = sh.alt || '';
      img.loading = 'lazy';
      f.appendChild(img);
      if (sh.caption) f.appendChild(el('figcaption', null, sh.caption));
      d.appendChild(f);
    });

    if (g.transcript) d.appendChild(el('pre', null, g.transcript));
    return d;
  }

  // ── Steps ───────────────────────────────────────────────────
  var main = el('main');
  steps.forEach(function (s, i) {
    var sec = el('section', 'step');
    sec.dataset.status = s.status || 'queued';
    sec.id = s.id || 'step-' + (i + 1);

    var head = el('header', 'step-head');
    var h2 = el('h2');
    h2.appendChild(el('span', 'stepnum', 'Step ' + (i + 1)));
    h2.appendChild(document.createTextNode(
      (s.plan ? s.plan + ' — ' : '') + (s.title || '')));
    head.appendChild(h2);
    var chip = el('span', 'chip');
    chip.dataset.status = s.status || 'queued';
    head.appendChild(chip);
    if (s.startedAt) {
      head.appendChild(el('span', 'times',
        s.startedAt + ' → ' + (s.finishedAt || '…')));
    }
    sec.appendChild(head);

    if (s.summary || s.commit) {
      var p = el('p', 'summary', s.summary ? s.summary + ' ' : '');
      if (s.commit && s.commit.hash) {
        p.appendChild(document.createTextNode('Commit '));
        p.appendChild(el('code', null, s.commit.hash));
        if (s.commit.diffstat) {
          p.appendChild(document.createTextNode(' · '));
          p.appendChild(el('code', null, s.commit.diffstat));
        }
      }
      sec.appendChild(p);
    }

    (s.gates || []).forEach(function (g) { sec.appendChild(renderGate(g)); });
    main.appendChild(sec);
  });
  app.appendChild(main);

  // ── Event log (newest first in the JSON) ────────────────────
  if (events.length) {
    var sec = el('section', 'log');
    sec.appendChild(el('h2', null, 'Event log'));
    var wrap = el('div', 'tablewrap');
    var t = el('table');
    events.forEach(function (e) {
      var tr = el('tr');
      tr.appendChild(el('td', 'logtime', e.t || ''));
      tr.appendChild(el('td', null, e.msg || ''));
      t.appendChild(tr);
    });
    wrap.appendChild(t);
    sec.appendChild(wrap);
    app.appendChild(sec);
  }
})();
</script>
