<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Site Timer Blocker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      margin: 0;
      padding: 14px;
      color: #1a1a1a;
      background-color: #ffffff;
    }

    h1 {
      font-size: 15px;
      margin: 0 0 12px 0;
      padding-bottom: 8px;
      border-bottom: 1px solid #e0e0e0;
    }

    .section {
      margin-bottom: 12px;
    }

    .domain-name {
      font-size: 14px;
      font-weight: bold;
      word-break: break-all;
    }

    .time-left {
      font-size: 13px;
      margin-top: 4px;
      color: #333;
    }

    .progress-track {
      margin-top: 8px;
      height: 8px;
      width: 100%;
      background-color: #eeeeee;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: #4CAF50;
      transition: width 0.3s ease;
    }

    .muted {
      color: #777;
      font-size: 13px;
    }

    button {
      cursor: pointer;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      transition: background-color 0.2s ease;
      white-space: nowrap;
    }

    .full-width {
      width: 100%;
      box-sizing: border-box;
    }

    .primary-button {
      background-color: #4CAF50;
      color: white;
    }
    .primary-button:hover:not(:disabled) {
      background-color: #45a049;
    }

    .secondary-button {
      background-color: #2196F3;
      color: white;
    }
    .secondary-button:hover {
      background-color: #1976D2;
    }

    .muted-footer-button {
      background: none;
      color: #777;
      font-size: 12px;
    }
    .muted-footer-button:hover {
      color: #444;
      text-decoration: underline;
    }

    .divider {
      border-top: 1px solid #e0e0e0;
      margin: 12px 0;
    }

    .hidden {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1a1a1a;
        color: #e0e0e0;
      }
      h1, .divider {
        border-color: #555;
      }
      .time-left {
        color: #cfcfcf;
      }
      .progress-track {
        background-color: #3d3d3d;
      }
    }
  </style>
</head>

<body>
  <h1>Site Timer Blocker</h1>

  <!-- Current site status -->
  <div id="statusSection" class="section">
    <div id="domainName" class="domain-name">&hellip;</div>

    <div id="timerSection" class="hidden">
      <div id="timeLeft" class="time-left"></div>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <div id="notTrackedSection" class="hidden">
      <div class="muted" style="margin: 4px 0 8px 0;">Not tracked yet.</div>
      <button id="blockSiteButton" class="primary-button full-width">+ Block this site</button>
    </div>

    <div id="notTrackableSection" class="hidden">
      <div class="muted">This page can't be tracked.</div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Reset token control -->
  <div id="resetSection" class="section hidden">
    <button id="resetTimerButton" class="primary-button full-width">Reset Timer</button>
    <div id="resetError" class="pause-error hidden"></div>
  </div>

  <div class="divider"></div>

  <!-- Options link -->
  <div id="optionsSection" class="section">
    <button id="openOptionsButton" class="muted-footer-button full-width">Open Options</button>
  </div>

  <script src="storage-utils.js"></script>
  <script src="timer-utils.js"></script>
  <script src="popup.js"></script>
</body>

</html>
